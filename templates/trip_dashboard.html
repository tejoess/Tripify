<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
    <div class="container" style="max-width: 600px; margin: 50px auto; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <h1 style="text-align: center; color: #333;">Trip: {{ trip.name }}</h1>

        <h2 style="color: #333;">Events</h2>
        <ul style="list-style-type: none; padding: 0;">
            {% for event in trip.events %}
                <li style="background: #e9ecef; margin: 10px 0; padding: 10px; border-radius: 5px;">
                    <strong>{{ event.person }}</strong> paid ₹{{ event.amount }} for {{ event.paid_for }}
                </li>
            {% endfor %}
        </ul>

        <h2 style="color: #333;">Balances</h2>
        <ul style="list-style-type: none; padding: 0;">
            {% for balance in balances %}
                <li style="background: #e9ecef; margin: 10px 0; padding: 10px; border-radius: 5px;">
                    {{ balance }}
                </li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('add_event', trip_index=trip_index) }}" style="display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none;">Add Event</a>
        <a href="{{ url_for('report', trip_index=trip_index) }}" style="display: block; text-align: center; margin-top: 10px; color: #007bff; text-decoration: none;">View Full Report</a>
    </div>
</body>
</html>
